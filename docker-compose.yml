services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]

  php:
    build: { context: ., dockerfile: docker/php/Dockerfile, target: app }
    # Matches php-fpm's runtime UID/GID to the host user that owns the
    # bind-mounted source tree (default 1000, the common single-user Linux
    # UID). Without this, php-fpm's workers run as www-data (uid 82) and
    # cannot write storage/framework or bootstrap/cache, which are owned by
    # the host user with group/other permissions of only 775.
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    volumes: [".:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  # Host ports are shifted off the defaults: another project on this machine
  # already publishes 3306, 1025 and 8025. Container-to-container traffic is
  # unaffected — the app still reaches mysql:3306 and mailpit:1025.
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: proposal_review
      MYSQL_USER: proposal
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql/init-testing-db.sql:/docker-entrypoint-initdb.d/10-testing-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine

  phpmyadmin:
    image: phpmyadmin:5
    ports: ["8081:80"]
    environment:
      PMA_HOST: mysql
      PMA_USER: proposal
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8026:8025", "1026:1025"]

volumes:
  mysqldata:
