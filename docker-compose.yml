# Without an explicit name, Compose derives the project from the directory
# basename ("backend") — a namespace another project on this machine already
# occupies. `docker compose down -v` would then delete THEIR volumes.
name: proposal-review

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]

  php:
    build: { context: ., dockerfile: docker/php/Dockerfile, target: app }
    # Run as the host user so files written through the bind mount are owned by
    # them, not by uid 82. The Makefile exports WWWUSER/WWWGROUP from `id`.
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    environment:
      # That UID has no /etc/passwd entry, so $HOME resolves to "/" which is
      # root-owned and unwritable. Composer needs a writable home or every
      # `composer` call inside the container fails.
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes: [".:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  # Without this service nothing queued ever runs, and it fails *silently* —
  # jobs and ShouldBroadcast events are accepted onto the Redis queue and sit
  # there forever. No error surfaces anywhere: the HTTP request that dispatched
  # them still returns 2xx. Notifications stop arriving and websocket pushes
  # stop firing, with a green API in front of them.
  queue:
    build: { context: ., dockerfile: docker/php/Dockerfile, target: app }
    # Mirrors `php` exactly — same image, same uid, same writable HOME. It runs
    # the same application code against the same bind mount; only the entry
    # point differs.
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes: [".:/var/www/html"]
    # --max-time recycles the worker hourly so a long-lived process cannot go
    # on serving code from before the last deploy; --tries gives a failing job
    # two retries before it lands in `failed_jobs` instead of looping forever.
    command: php artisan queue:work --tries=3 --max-time=3600
    # `unless-stopped` is load-bearing on a fresh clone, not boilerplate: the
    # bind mount shadows the image's vendor/, so this container starts before
    # `make up` has run `composer install` and exits immediately on a missing
    # autoloader. It restarts until vendor/ appears. Expect a few early crash
    # loops in `docker compose logs queue` on the very first `make up`.
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: proposal_review
      MYSQL_USER: proposal
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    # Parameterised, not hardcoded: a reviewer with a local MySQL already on
    # 3306 would otherwise be blocked before step one.
    ports: ["${DB_HOST_PORT:-3306}:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql/init-testing-db.sql:/docker-entrypoint-initdb.d/10-testing-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine

  phpmyadmin:
    image: phpmyadmin:5
    ports: ["8081:80"]
    environment:
      PMA_HOST: mysql
      PMA_USER: proposal
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports: ["8025:8025", "1025:1025"]

volumes:
  mysqldata:
